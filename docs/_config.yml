title: goenv
tagline: One environment variable, two answers
description: A zero-dependency Go library that reads the ENV environment variable and tells you whether the process runs in prod or dev, defaulting to prod.
lang: en
url: https://psyb0t.github.io
baseurl: /goenv
repository: psyb0t/goenv
author: Ciprian Mandache

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/goenv
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/goenv/blob/main/CHANGELOG.md

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/goenv
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
